<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món quà 20/10 dành tặng chị iuuu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #fff7fa 0%, #ffd6e4 55%, #ffacc7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #800f2f;
        }

        .bg-heart {
            position: absolute;
            bottom: -60px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: floatUpHeart var(--duration) linear infinite;
            animation-delay: var(--delay);
            opacity: 0;
            filter: drop-shadow(0 3px 6px rgba(255, 77, 109, 0.25));
        }

        @keyframes floatUpHeart {
            0% {
                transform: translateY(0) translateX(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: var(--max-opacity);
            }
            50% {
                transform: translateY(-50vh) translateX(var(--sway)) scale(1) rotate(15deg);
            }
            85% {
                opacity: var(--max-opacity);
            }
            100% {
                transform: translateY(-115vh) translateX(calc(var(--sway) * -1)) scale(1.2) rotate(-15deg);
                opacity: 0;
            }
        }

        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 30;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .gift-prompt {
            font-size: 1.3rem;
            font-weight: 700;
            color: #d90429;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.25);
            margin-bottom: 32px;
            animation: bounce 1.5s infinite ease-in-out;
            text-align: center;
            user-select: none;
        }

        .gift-box {
            position: relative;
            width: 140px;
            height: 125px;
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            border-radius: 12px;
            box-shadow: 0 18px 35px rgba(201, 24, 74, 0.35), 0 0 25px rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            transition: transform 0.3s;
        }

        .gift-container:hover .gift-box {
            transform: scale(1.06);
        }

        .ribbon-v {
            position: absolute;
            width: 26px;
            height: 100%;
            background: linear-gradient(to right, #ffe066, #ffd166);
        }

        .ribbon-h {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 26px;
            background: linear-gradient(to bottom, #ffe066, #ffd166);
        }

        .gift-lid {
            position: absolute;
            top: -22px;
            width: 156px;
            height: 30px;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(164, 19, 60, 0.25);
            display: flex;
            justify-content: center;
            transition: all 0.8s ease;
            z-index: 2;
        }

        .bow {
            position: absolute;
            top: -18px;
            width: 50px;
            height: 20px;
            display: flex;
            justify-content: space-between;
        }

        .bow::before, .bow::after {
            content: '';
            width: 22px;
            height: 20px;
            border: 4px solid #ffd166;
            border-radius: 50% 50% 10% 50%;
            transform: rotate(-30deg);
        }

        .bow::after {
            border-radius: 50% 50% 50% 10%;
            transform: rotate(30deg);
        }

        .gift-container.open .gift-lid {
            transform: translateY(-100px) rotate(-25deg);
            opacity: 0;
        }

        .gift-container.open {
            opacity: 0;
            transform: scale(0.4);
            pointer-events: none;
        }

        .stage {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }

        .photo-gallery {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .polaroid {
            position: absolute;
            width: 120px;
            height: 145px;
            background: #ffffff;
            padding: 7px 7px 24px 7px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(164, 19, 60, 0.22), 0 0 12px rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: translate(0, 100px) scale(0.1) rotate(0deg);
            transition: transform 1.8s ease-in-out, opacity 1s ease, box-shadow 0.3s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .polaroid::after {
            content: '❤️';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
        }

        .polaroid.center-piece {
            width: 190px;
            height: 225px;
            padding: 10px 10px 34px 10px;
            z-index: 35 !important;
            border: 2px solid #ff8fa3;
            box-shadow: 0 18px 45px rgba(201, 24, 74, 0.38), 0 0 30px rgba(255, 255, 255, 1);
        }

        .polaroid.center-piece::after {
            content: '💖 Mãi iuu 💖';
            font-size: 0.82rem;
            font-weight: 700;
            color: #d90429;
            bottom: 7px;
            white-space: nowrap;
        }

        .polaroid.orbiting {
            animation: gentleFloat var(--float-dur, 4s) ease-in-out infinite alternate;
        }

        @keyframes gentleFloat {
            0% {
                transform: translate(var(--final-x), var(--final-y)) scale(0.95) rotate(var(--final-r));
            }
            100% {
                transform: translate(calc(var(--final-x) + var(--dx, 10px)), calc(var(--final-y) - 15px)) scale(1) rotate(calc(var(--final-r) + 5deg));
            }
        }

        .polaroid.orbiting:hover {
            animation-play-state: paused;
            transform: translate(var(--final-x), var(--final-y)) scale(1.28) rotate(0deg) !important;
            z-index: 45 !important;
            box-shadow: 0 20px 45px rgba(164, 19, 60, 0.45), 0 0 25px rgba(255, 77, 109, 0.7);
        }

        .message-box {
            position: relative;
            margin-top: 240px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 117, 143, 0.55);
            border-radius: 22px;
            padding: 18px 26px;
            max-width: 470px;
            width: 88%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(201, 24, 74, 0.2);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
            pointer-events: auto;
            z-index: 36;
        }

        .message-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .card-title {
            font-size: 1.7rem;
            color: #d90429;
            text-shadow: 0 2px 10px rgba(255, 77, 109, 0.25);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .card-message {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.55;
            color: #800f2f;
            min-height: 32px;
            border-right: 2px solid #ff4d6d;
            display: inline-block;
            white-space: pre-wrap;
            animation: blink 0.7s infinite;
        }

        .particle {
            position: absolute;
            font-size: 1.6rem;
            user-select: none;
            pointer-events: none;
            z-index: 40;
            animation: flyOut var(--duration) ease-out forwards;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ff4d6d; }
        }

        @keyframes flyOut {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.4);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot));
            }
        }

        @media (max-width: 600px) {
            .polaroid {
                width: 85px;
                height: 105px;
                padding: 5px 5px 18px 5px;
            }
            .polaroid.center-piece {
                width: 150px;
                height: 180px;
                padding: 8px 8px 26px 8px;
            }
            .message-box {
                margin-top: 195px;
                padding: 14px 18px;
            }
            .card-title {
                font-size: 1.4rem;
            }
            .card-message {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <div class="gift-container" id="giftBox" onclick="openGift()">
        <div class="gift-prompt">✨❤️ Mở quà đi chị ❤️✨</div>
        <div class="gift-box">
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
            <div class="gift-lid">
                <div class="ribbon-v" style="width: 26px; height: 100%;"></div>
                <div class="bow"></div>
            </div>
        </div>
    </div>

    <div class="stage">
        <div class="photo-gallery" id="gallery"></div>

        <div class="message-box" id="messageBox">
            <h2 class="card-title">Dành tặng chị iuuu ❤️</h2>
            <div class="card-message" id="messageText"></div>
        </div>
    </div>

    <script>

        const photoList = [
            'anh1.jpg', 
            'anh2.jpg', 
            'anh3.jpg',
            'anh4.jpg',
            'anh5.jpg',
            'anh6.jpg',
            'anh7.jpg',
            'anh8.jpg',
            'anh9.jpg'
        ];

        const fallbackOuter = ['anh2.jpg', 'anh3.jpg', 'anh4.jpg'];
        const gallery = document.getElementById('gallery');
        const polaroidElements = [];

        photoList.forEach((src, idx) => {
            const card = document.createElement('div');
            card.className = idx === 0 ? 'polaroid center-piece' : 'polaroid';
            card.style.zIndex = idx === 0 ? 35 : (10 + idx);

            const img = document.createElement('img');
            img.src = src;

            img.onerror = function() {
                if (idx !== 0 && !this.dataset.triedFallback) {
                    this.dataset.triedFallback = 'true';
                    this.src = fallbackOuter[(idx - 1) % fallbackOuter.length];
                } else if (!this.dataset.triedSingle) {
                    this.dataset.triedSingle = 'true';
                    this.src = 'photo.jpg';
                } else {
                    this.src = 'https://images.unsplash.com/photo-1518895949257-7621c3c786d7?q=80&w=600&auto=format&fit=crop';
                }
            };

            card.appendChild(img);

            if (idx !== 0) {
                card.onclick = function() {
                    const centerImg = polaroidElements[0].querySelector('img');
                    const tempSrc = centerImg.src;
                    centerImg.src = img.src;
                    img.src = tempSrc;
                };
            }

            gallery.appendChild(card);
            polaroidElements.push(card);
        });

        function initFloatingHearts() {
            const heartIcons = ['❤️', '💖', '💗', '💕', '💓', '🌸', '🌷'];
            const totalHearts = 50;

            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                
                const size = Math.random() * 1.4 + 0.8;
                heart.style.fontSize = size + 'rem';
                heart.style.left = Math.random() * 96 + 'vw';
                heart.style.setProperty('--duration', (Math.random() * 6 + 6) + 's');
                heart.style.setProperty('--delay', (Math.random() * -12) + 's');
                heart.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
                heart.style.setProperty('--max-opacity', (Math.random() * 0.45 + 0.35));

                document.body.appendChild(heart);
            }
        }
        initFloatingHearts();

        let opened = false;
        function openGift() {
            if (opened) return;
            opened = true;

            const giftBox = document.getElementById('giftBox');
            giftBox.classList.add('open');
            triggerBurst();

            setTimeout(() => {
                giftBox.style.display = 'none';

                polaroidElements.forEach((el, i) => {
                    const angle = (i / polaroidElements.length) * Math.PI * 2;
                    const rx = Math.cos(angle) * 28 + 'vw';
                    const ry = Math.sin(angle) * 22 + 'vh';
                    const rot = (Math.random() * 40 - 20) + 'deg';
                    el.style.opacity = '1';
                    el.style.transform = `translate(${rx}, ${ry}) scale(0.95) rotate(${rot})`;
                });
            }, 200);

            setTimeout(() => {
                polaroidElements.forEach((el, i) => {
                    const angle = ((i + 3) / polaroidElements.length) * Math.PI * 2;
                    const rx = Math.cos(angle) * 33 + 'vw';
                    const ry = Math.sin(angle) * 26 + 'vh';
                    const rot = (Math.random() * 36 - 18) + 'deg';
                    el.style.transform = `translate(${rx}, ${ry}) scale(1) rotate(${rot})`;
                });
            }, 1900);

            setTimeout(() => {
                polaroidElements.forEach((el, i) => {
                    if (i === 0) {
                        el.style.transform = `translate(0px, -45px) scale(1.05) rotate(-3deg)`;
                    } else {
                        const angle = ((i - 1) / 8) * Math.PI * 2;
                        const rx = Math.cos(angle) * 36 + 'vw';
                        const ry = Math.sin(angle) * 30 + 'vh';
                        el.style.transform = `translate(${rx}, ${ry}) scale(0.95) rotate(${(i % 2 === 0 ? 10 : -10)}deg)`;
                    }
                });
            }, 3500);

            setTimeout(() => {
                const centerEl = polaroidElements[0];
                centerEl.style.transform = `translate(0px, -80px) scale(1.08) rotate(0deg)`;

                const outerPositions = [
                    { x: '-37vw', y: '-32vh', r: '-14deg' }, // Trên cùng bên trái
                    { x: '-19vw', y: '-36vh', r: '7deg'   }, // Trên giữa trái
                    { x: '19vw',  y: '-36vh', r: '-7deg'  }, // Trên giữa phải
                    { x: '37vw',  y: '-32vh', r: '14deg'  }, // Trên cùng bên phải
                    { x: '-39vw', y: '0vh',   r: '11deg'  }, // Giữa rìa trái
                    { x: '39vw',  y: '0vh',   r: '-11deg' }, // Giữa rìa phải
                    { x: '-34vw', y: '33vh',  r: '-9deg'  }, // Dưới cùng bên trái
                    { x: '34vw',  y: '33vh',  r: '9deg'   }  // Dưới cùng bên phải
                ];

                for (let i = 1; i < polaroidElements.length; i++) {
                    const el = polaroidElements[i];
                    const pos = outerPositions[(i - 1) % outerPositions.length];

                    el.style.setProperty('--final-x', pos.x);
                    el.style.setProperty('--final-y', pos.y);
                    el.style.setProperty('--final-r', pos.r);
                    el.style.setProperty('--float-dur', (3.2 + (i % 3) * 0.7) + 's');
                    el.style.setProperty('--dx', (i % 2 === 0 ? '12px' : '-12px'));

                    el.style.transform = `translate(${pos.x}, ${pos.y}) scale(0.95) rotate(${pos.r})`;

                    setTimeout(() => {
                        el.classList.add('orbiting');
                    }, 1800);
                }

                const messageBox = document.getElementById('messageBox');
                messageBox.classList.add('show');
                setTimeout(runTypewriter, 700);
            }, 5000);
        }

        function triggerBurst() {
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerHTML = ['💖', '🌸', '✨', '💕', '❤️', '🌷', '💗'][Math.floor(Math.random() * 7)];

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 320 + 80;
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
                p.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
                p.style.setProperty('--rot', (Math.random() * 360) + 'deg');
                p.style.setProperty('--duration', (Math.random() * 1.8 + 1.4) + 's');

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3200);
            }
        }

        const wishText = "20/10, chúc chị luôn xinh đẹp rạng rỡ và yêu đời, yêu em nữa nhé ❤️";
        const msgEl = document.getElementById('messageText');
        let charIdx = 0;

        function runTypewriter() {
            if (charIdx < wishText.length) {
                msgEl.textContent += wishText.charAt(charIdx);
                charIdx++;
                setTimeout(runTypewriter, 75);
            } else {
                msgEl.style.borderRight = "none";
                msgEl.style.animation = "none";
            }
        }
    </script>
</body>
</html>
